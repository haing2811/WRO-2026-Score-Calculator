<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRO 2026 Score Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="header">
        <div class="header-content">
            <div class="header-left">
                <img src="iconrb.png" alt="WRO Logo" class="logo">
            </div>
            <div class="header-title">
                WRO 2026 Score Calculator
            </div>
            <div class="header-controls">
                <div class="control-group">
                    <label for="team-name">Team Name:</label>
                    <input type="text" id="team-name" placeholder="RobotRizz">
                </div>
                <div class="control-group">
                    <label for="round-number">Round:</label>
                    <input type="number" id="round-number" min="1" value="1">   
                </div>
                <div class="control-group">
                    <label for="time-seconds">Time (s):</label>
                    <input type="number" id="time-seconds" min="0" value="0">
                </div>
                <button class="btn-secondary" id="btn-reset">Reset</button>
                <button class="btn-primary" id="btn-save">Save Run</button>
                <button class="btn-danger btn-link" id="btn-history">History</button>
            </div>
        </div>
    </header>

    <div id="tabs">
        <button class="tab-btn" data-category="elementary">Elementary — Robot Rockstars</button>
        <button class="tab-btn" data-category="junior">Junior — Heritage Heroes</button>
        <button class="tab-btn" data-category="senior">Senior — Mosaic Masters</button>
    </div>

    <div id="main-container">
        <!-- Field Map Panel -->
        <div id="canvas-container">
            <div class="field-header">FIELD MAP — Elementary</div>
            <div id="field-wrapper">
                <canvas id="field-canvas"></canvas>
                <div id="overlay-container"></div>
            </div>
        </div>

        <!-- Scoring Sidebar -->
        <div id="sidebar"></div>
    </div>

    <!-- Live Total Bar -->
    <div id="live-total">
        <div class="live-total-content">
            <span>Total Score:</span>
            <span id="total-score">0 / 0</span>
        </div>
    </div>

    <!-- History Modal (hidden by default) -->
    <section id="history-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Run History</h2>
            <table id="history-table-element">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>Round</th>
                        <th>Score</th>
                        <th>Time (s)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- History rows will be populated here -->
                </tbody>
            </table>
            <button class="btn-secondary" id="btn-close-history">Close</button>
        </div>
    </section>

    <script src="script.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(error => {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
</body>
</html>
